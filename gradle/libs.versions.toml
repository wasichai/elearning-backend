[versions]
# alineadas con Wasichai 1.8.0 (su gradle/libs.versions.toml): no se adelantan por separado
kotlin = "2.4.21"
springBoot = "4.1.2"
wasichai = "1.8.0"
ktlint = "14.2.0"
ktlintTool = "1.7.1"
# OpenAPI del LMS (ADR-0008): la línea 3.x es la de Spring Boot 4
springdoc = "3.2.0"
# almacén S3 compatible de wasichai-files (RF-CON-02): la misma versión con la que Wasichai 1.8.0 lo compila y prueba
awsSdk = "2.57.5"
# saneado con lista blanca del HTML generado (docs/security/README.md §5.2, ADR-0022): ni Wasichai ni el JDK traen uno
jsoup = "1.21.2"
# canalización con IA (ADR-0033 §1): la misma que Wasichai 1.8.0. el BOM de Wasichai no la gestiona (wasichai-agent no se
# usa) y Spring AI, anthropic-java y openai-java llegan con ella. subirla es una decisión con su prueba
embabel = "1.5.4"

[libraries]
wasichai-bom = { module = "wasichai:wasichai-bom", version.ref = "wasichai" }
wasichai-starter = { module = "wasichai:wasichai-spring-boot-starter" }
# archivos de los recursos (ADR-0012): FileStore local en desarrollo, S3 por configuración
wasichai-starter-files = { module = "wasichai:wasichai-spring-boot-starter-files" }
# avisos de sesiones y calendario (RF-SES-03, RF-AUL-09), con correo opcional
# el almacén S3 de wasichai-files solo se activa con el SDK en el classpath: el starter no lo trae (ADR-0018 §8)
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
wasichai-starter-notifications = { module = "wasichai:wasichai-spring-boot-starter-notifications" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
embabel-agent-starter = { module = "com.embabel.agent:embabel-agent-starter", version.ref = "embabel" }
embabel-agent-starter-anthropic = { module = "com.embabel.agent:embabel-agent-starter-anthropic", version.ref = "embabel" }
embabel-agent-starter-openai = { module = "com.embabel.agent:embabel-agent-starter-openai", version.ref = "embabel" }
wasichai-test = { module = "wasichai:wasichai-test" }
springdoc-webflux-api = { module = "org.springdoc:springdoc-openapi-starter-webflux-api", version.ref = "springdoc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
