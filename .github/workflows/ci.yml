name: ci

on:
  push:
    branches: [main]
  pull_request:

# lo mínimo: leer el código y los paquetes de Wasichai (GitHub Packages pide token incluso para leer, ADR-0002).
# acciones fijadas por SHA (la etiqueta mayor al lado) y el token solo en los pasos que lo usan
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: build, pruebas e integración
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      # formato (ktlint), unitarias y arquitectura; después integración con Testcontainers postgres:18. check incluye
      # noRemotion: el render es opcional y Remotion nunca llega al classpath del backend (ADR-0039 §3-4)
      - run: ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Asciidoctor real para la aceptación de RF-CON-07 (ADR-0031), con versiones fijas; LMS_TEST_ASCIIDOCTOR=required hace
      # que su falta sea un fallo y no una prueba saltada. la imagen de despliegue lo trae en F6 (RNF-OPS-04)
      - name: Asciidoctor
        run: |
          sudo gem install --no-document asciidoctor:2.0.26 asciidoctor-pdf:2.3.27
          asciidoctor --version
          asciidoctor-pdf --version
      # incluye la prueba de humo de la comparación de modelos contra el doble HTTP (ModelEvaluationSmokeTest, sin cifras);
      # ./gradlew aiEval, contra los proveedores reales, nunca corre en CI (docs/ai §9)
      - run: ./gradlew integrationTest --no-daemon --max-workers=2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LMS_TEST_ASCIIDOCTOR: required
      - name: informes de pruebas
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

  model:
    name: modelo y datos de demostración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 model/apply.py --validate-only --demo
      - run: python3 model/apply.py --validate-only --demo --demo-data model/demo/data.json --demo-data model/demo/poblada.json
      - run: python3 -m unittest -v
        working-directory: model

  format:
    name: formato de documentos y configuración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn format:check
      # el render es opcional (ADR-0039 §3-4, criterio de #267): Remotion es solo de render-worker/, que no es un workspace.
      # ni el yarn.lock raíz ni su node_modules lo traen
      - name: sin Remotion fuera de render-worker
        run: |
          node -e "if (require('./package.json').workspaces) { console.error('el package.json raíz no puede tener workspaces'); process.exit(1) }"
          if grep -nE '^"?(remotion|@remotion/)' yarn.lock; then echo "yarn.lock raíz trae Remotion" >&2; exit 1; fi
          if [ -e node_modules/remotion ] || [ -e node_modules/@remotion ]; then echo "node_modules raíz trae Remotion" >&2; exit 1; fi
          grep -q '"remotion"' render-worker/package.json

  render-worker:
    name: trabajador de render y licencias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: render-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: render-worker/.node-version
      - run: yarn install --frozen-lockfile
      # el Chrome Headless Shell de Remotion, para el render de verdad (test/render.test.mjs); las demás pruebas usan un
      # renderizador simulado
      - run: yarn ensure-browser
      - run: yarn test
        env:
          RENDER_WORKER_TEST_RENDER: required
      # informe de licencias sobre lo que lleva la imagen (sin dependencias de desarrollo): Remotion aparece aquí y solo aquí
      - name: informe de licencias
        run: |
          rm -rf node_modules
          yarn install --frozen-lockfile --production --ignore-scripts
          yarn run licenses --out licencias.md
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: render-worker-licencias
          path: render-worker/licencias.md
          retention-days: 30

  commits:
    name: mensajes de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
