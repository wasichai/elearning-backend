# Entorno local: solo PostgreSQL 18, publicado en loopback (127.0.0.1:5436; el 5432 queda libre y ningún test lo usa).
# Más servicios (MinIO, Mailpit) entran cuando un requisito los necesite, no antes.
name: elearning

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${WASICHAI_DB_NAME:-elearning}
      POSTGRES_USER: ${WASICHAI_DB_USERNAME:-elearning}
      POSTGRES_PASSWORD: ${WASICHAI_DB_PASSWORD:-elearning-dev}
    ports:
      - '127.0.0.1:${WASICHAI_DB_PORT:-5436}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
