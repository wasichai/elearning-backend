# Entorno local: PostgreSQL 18, un buzón de correo de pruebas y un almacén S3 compatible (MinIO), publicados en loopback
# (el 5432 queda libre y ningún test lo usa).
name: elearning

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${WASICHAI_DB_NAME:-elearning}
      POSTGRES_USER: ${WASICHAI_DB_USERNAME:-elearning}
      POSTGRES_PASSWORD: ${WASICHAI_DB_PASSWORD:-elearning-dev}
    ports:
      - '127.0.0.1:${WASICHAI_DB_PORT:-5436}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # RNF-OPS-03: el correo de desarrollo se queda aquí; la bandeja en http://127.0.0.1:8026
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

  # RF-CON-02: almacén S3 compatible para los archivos (perfil minio de la aplicación). API en 127.0.0.1:9010, consola en
  # http://127.0.0.1:9011. minio/minio dejó Docker Hub: pgsty/minio es su continuación comunitaria, el mismo servidor
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${LMS_MINIO_USER:-elearning}
      MINIO_ROOT_PASSWORD: ${LMS_MINIO_PASSWORD:-elearning-dev}
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - minio-data:/data

  # crea el bucket una vez y termina; reintenta mientras MinIO arranca. MC_HOST_<alias> evita guardar la configuración
  minio-bucket:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${LMS_MINIO_USER:-elearning}:${LMS_MINIO_PASSWORD:-elearning-dev}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${LMS_MINIO_BUCKET:-elearning-archivos}']
    restart: on-failure

volumes:
  postgres-data:
  minio-data:
