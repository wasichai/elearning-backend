# La base de datos sale de WASICHAI_DB_HOST/PORT/NAME/USERNAME/PASSWORD (las lee Wasichai). El secreto del JWT no tiene
# valor por defecto a propósito: sin WASICHAI_JWT_SECRET la aplicación no arranca.
server:
  port: ${PORT:8090}

spring:
  application:
    name: elearning-backend
  # el modelo solo recibe las entradas de su ejecución: ni servidores MCP ni sus herramientas (ADR-0033 §4, RF-IA-06).
  # Embabel trae el cliente MCP de Spring AI; se apaga entero, también el registro de sus anotaciones
  ai:
    mcp:
      client:
        enabled: false
        annotation-scanner:
          enabled: false

# Embabel (ADR-0033): cada proveedor existe solo con su clave, ANTHROPIC_API_KEY u OPENAI_API_KEY, que Embabel lee del
# entorno; elearning.ai.AiProviderGate deja fuera al que no la tiene. ANTHROPIC_BASE_URL y OPENAI_BASE_URL tienen
# precedencia sobre base-url. un solo nivel de reintento: Embabel hace como mucho 2 intentos por llamada y los reintentos
# son de la cola (§6); con más, la aplicación no arranca. En 1.5.4 el que envuelve cada llamada tipada es el de
# llm-operations.data-binding (repite cualquier fallo; el segundo intento corrige una salida inválida); el de cada proveedor
# solo cuenta en el camino Chat Completions de OpenAI. El SDK del proveedor repite además 408, 409, 429 y 5xx dos veces
# dentro de cada intento (docs/ai §2, comprobado con el doble HTTP)
embabel:
  agent:
    platform:
      llm-operations:
        data-binding:
          max-attempts: 2
      # ningún paso tiene herramientas: si el modelo pide una (una fuente inyectada que dice «llama a la herramienta X»), el
      # bucle de Embabel falla en la primera, sin contestarle con la lista de las que hay, y ModelCalls lo deja en
      # INVALID_OUTPUT (RF-IA-06, docs/security §4.5). Con el valor por defecto (3) le contesta tres veces y el contador es
      # compartido entre llamadas
      toolloop:
        tool-not-found:
          max-retries: 0
      models:
        anthropic:
          max-attempts: 2
        openai:
          max-attempts: 2

# actuator: ni el entorno, ni las propiedades enlazadas, ni un volcado de memoria, que llevarían las claves de los
# proveedores (RNF-SEG-09, ADR-0033 §12). exclude gana a cualquier include, también al de Wasichai; y si alguien los
# expusiera, los valores salen tapados
management:
  endpoints:
    web:
      exposure:
        exclude: env,configprops,heapdump
    jmx:
      exposure:
        exclude: env,configprops,heapdump
  endpoint:
    env:
      show-values: never
    configprops:
      show-values: never

wasichai:
  security:
    jwt:
      secret: ${WASICHAI_JWT_SECRET:}
      revocation: true
    login:
      enabled: true
  web:
    problem-base-uri: ${LMS_PROBLEM_BASE_URI:https://wasichai-learning.dev/problems}
    # orígenes de navegador que pueden llamar a la API, separados por comas (#67). vacío: ninguno ajeno, que es lo
    # correcto con la UI y la API bajo el mismo dominio. Wasichai trae http://localhost:* para cualquier entorno
    cors-allowed-origin-patterns: ${WASICHAI_CORS_ALLOWED_ORIGINS:}
  # archivos de los recursos (ADR-0012): nunca en PostgreSQL. local en desarrollo; S3 compatible (AWS, MinIO…) con
  # WASICHAI_FILES_STORE=s3 y WASICHAI_FILES_S3_* (RF-CON-02, docs/operations); el perfil minio usa el de compose.yaml.
  # la subida se lee entera en memoria antes de comprobarse: 25 MB alcanza para lecturas, PDF y vídeos cortos
  files:
    max-bytes: 25MB
    local:
      path: ${LMS_FILES_PATH:var/archivos}

# contrato OpenAPI del LMS (ADR-0008): solo /api/lms/**, servido en la ruta pública (solo GET, sin sesión)
springdoc:
  api-docs:
    path: /api/lms/public/openapi
  # solo lo público: una ruta privada futura de /api/lms no debe acabar en el contrato anónimo
  paths-to-match: /api/lms/public/**
  writer-with-order-by-keys: true

lms:
  product-name: ${LMS_PRODUCT_NAME:wasichai-learning}
  public:
    # slug de la organización cuyo catálogo es público; vacío = sin catálogo público
    organization: ${LMS_PUBLIC_ORGANIZATION:}
  catalog:
    # cada cuánto se refresca la proyección pública (ADR-0011): un cambio tarda como mucho esto en verse
    refresh: ${LMS_CATALOG_REFRESH:30s}
  # cola persistente de trabajos (ADR-0018 §4): lo largo o bloqueante corre aquí, fuera del hilo de WebFlux
  jobs:
    # false: esta réplica encola pero no ejecuta
    scheduling: ${LMS_JOBS_SCHEDULING:true}
    poll: ${LMS_JOBS_POLL:5s}
    # trabajos a la vez por réplica
    parallelism: ${LMS_JOBS_PARALLELISM:2}
    max-attempts: ${LMS_JOBS_MAX_ATTEMPTS:3}
    # espera antes del reintento n: backoff × n
    backoff: ${LMS_JOBS_BACKOFF:30s}
    timeout: ${LMS_JOBS_TIMEOUT:10m}
    # un trabajo en curso con un reclamo más viejo que esto se da por perdido y se vuelve a reclamar; mayor que timeout
    lease: ${LMS_JOBS_LEASE:15m}
    # trabajos pendientes o en curso de una misma persona; uno más es 429 (ADR-0022)
    max-active-per-requester: ${LMS_JOBS_MAX_ACTIVE_PER_REQUESTER:5}
    # un trabajo terminado se borra pasado este plazo (ADR-0022); la pasada corre cada purge-every
    retention: ${LMS_JOBS_RETENTION:30d}
    purge-every: ${LMS_JOBS_PURGE_EVERY:1h}
  assessment:
    # cada cuánto se encola el barrido que cierra los intentos abandonados con el plazo vencido (L4 de #183)
    sweep-every: ${LMS_ASSESSMENT_SWEEP_EVERY:1m}
  # supresión de datos personales (ADR-0037, RNF-SEG-11): cada cuánto se encola la de las aceptaciones de los términos de
  # uso vencidas (y la de las retiradas cuya supresión no terminó). una vencida deja de valer al momento; esto es cuánto
  # tarda como mucho en suprimirse
  privacy:
    sweep-every: ${LMS_PRIVACY_SWEEP_EVERY:1h}
  # valoraciones de docentes y recursos (ADR-0038): los valores de la política de #268, a confirmar por el titular
  reputation:
    # progreso del aula (%) desde el que se valora a un docente; una matrícula FINALIZADA siempre
    min-progress: ${LMS_REPUTATION_MIN_PROGRESS:50}
    # muestra mínima de un indicador; por debajo de 3 vale 3
    min-sample: ${LMS_REPUTATION_MIN_SAMPLE:5}
    # cuánto tras el fin de la edición se crea, edita o retira una valoración
    window-after-end: ${LMS_REPUTATION_WINDOW_AFTER_END:30d}
    # pasado esto tras el fin, el docente ve sus resultados aunque falten resultados de matrículas
    release-after-end: ${LMS_REPUTATION_RELEASE_AFTER_END:60d}
    # cambios (alta, edición o retirada) y denuncias por persona y día UTC; uno más es 429
    max-edits-per-day: ${LMS_REPUTATION_MAX_EDITS_PER_DAY:5}
    max-reports-per-day: ${LMS_REPUTATION_MAX_REPORTS_PER_DAY:10}
    # cada cuánto se encola el trabajo de agregados: congela las ediciones liberadas y rehace los indicadores de recurso
    aggregate-every: ${LMS_REPUTATION_AGGREGATE_EVERY:1d}
  # importador AsciiDoc (ADR-0018 §5): solo lee de estos repositorios, separados por comas, como owner/repo (cualquier
  # commit) u owner/repo@sha (solo ese). vacío: no importa nada. el host de GitHub es fijo, nunca configuración
  importer:
    allowed-sources: ${LMS_IMPORTER_ALLOWED_SOURCES:}
    timeout: ${LMS_IMPORTER_TIMEOUT:10s}
    max-bytes: ${LMS_IMPORTER_MAX_BYTES:2MB}
    # archivos que una importación puede leer, entre fragmentos e imágenes; más hace fallar la importación
    max-files: ${LMS_IMPORTER_MAX_FILES:300}
    # opcional, para repositorios privados o más cuota; solo por entorno
    github-token: ${LMS_IMPORTER_GITHUB_TOKEN:}
  # generación de artefactos HTML y PDF desde una fuente AsciiDoc (ADR-0018 §7): Asciidoctor en modo seguro, en la cola.
  # la imagen de despliegue trae los ejecutables; sin ellos, el trabajo falla con un error claro
  media:
    asciidoctor:
      html: ${LMS_MEDIA_ASCIIDOCTOR_HTML:asciidoctor}
      pdf: ${LMS_MEDIA_ASCIIDOCTOR_PDF:asciidoctor-pdf}
      # cada generación (HTML y PDF por separado); por debajo de lms.jobs.timeout
      timeout: ${LMS_MEDIA_ASCIIDOCTOR_TIMEOUT:2m}
      max-bytes: ${LMS_MEDIA_ASCIIDOCTOR_MAX_BYTES:25MB}
  # render de vídeo con Remotion en el trabajador render-worker/ (ADR-0039, ADR-0040, RF-MED-02). Opcional y apagado: así
  # no hay manejador ni cliente HTTP y pedir un render es 409. Encendido, no arranca sin la URL y el secreto del trabajador,
  # ni si wasichai.files.max-bytes es menor que max-bytes. Quien lo enciende responde de su licencia de Remotion (docs/operations)
  render:
    enabled: ${LMS_RENDER_ENABLED:false}
    worker-url: ${LMS_RENDER_WORKER_URL:}
    # el secreto compartido con el trabajador (su RENDER_WORKER_TOKEN), 32 caracteres o más; solo por entorno
    worker-token: ${LMS_RENDER_WORKER_TOKEN:}
    # de la petición al informe; lms.jobs.lease tiene que ser mayor
    timeout: ${LMS_RENDER_TIMEOUT:30m}
    # renders en curso a la vez entre todas las réplicas; los demás esperan en la cola sin gastar intentos
    max-concurrent: ${LMS_RENDER_MAX_CONCURRENT:1}
    max-seconds: ${LMS_RENDER_MAX_SECONDS:900}
    max-bytes: ${LMS_RENDER_MAX_BYTES:256MB}
  # canalización editorial con IA (ADR-0033). sin claves no hay proveedor y cada paso usa su doble determinista
  ai:
    # con las dos claves, cuál usa la canalización: anthropic u openai. vacío: Anthropic. sin claves no cuenta
    provider: ${LMS_AI_PROVIDER:}
    # modelo por defecto (el de Embabel) y por paso de cada proveedor (§3); solo cuentan los del proveedor con clave. un
    # modelo que el proveedor no tiene impide arrancar
    models:
      anthropic:
        default: ${LMS_AI_ANTHROPIC_MODEL_DEFAULT:claude-sonnet-5-5}
        extraction: ${LMS_AI_ANTHROPIC_MODEL_EXTRACTION:claude-haiku-5-5}
        design: ${LMS_AI_ANTHROPIC_MODEL_DESIGN:claude-sonnet-5-5}
        draft: ${LMS_AI_ANTHROPIC_MODEL_DRAFT:claude-sonnet-5-5}
        script: ${LMS_AI_ANTHROPIC_MODEL_SCRIPT:claude-sonnet-5-5}
        review: ${LMS_AI_ANTHROPIC_MODEL_REVIEW:claude-sonnet-5-5}
        # referencia en la comparación de modelos (RF-IA-09)
        reference: ${LMS_AI_ANTHROPIC_MODEL_REFERENCE:claude-opus-5-5}
        # la opinión de consistencia contenido-evaluación (E34.2): un modelo barato, el de extracción
        consistency: ${LMS_AI_ANTHROPIC_MODEL_CONSISTENCY:claude-haiku-5-5}
      openai:
        default: ${LMS_AI_OPENAI_MODEL_DEFAULT:gpt-6.1-sol}
        extraction: ${LMS_AI_OPENAI_MODEL_EXTRACTION:gpt-6-luna}
        design: ${LMS_AI_OPENAI_MODEL_DESIGN:gpt-6.1-sol}
        draft: ${LMS_AI_OPENAI_MODEL_DRAFT:gpt-6.1-sol}
        script: ${LMS_AI_OPENAI_MODEL_SCRIPT:gpt-6.1-sol}
        review: ${LMS_AI_OPENAI_MODEL_REVIEW:gpt-6.1-sol}
        reference: ${LMS_AI_OPENAI_MODEL_REFERENCE:gpt-6-astra}
        consistency: ${LMS_AI_OPENAI_MODEL_CONSISTENCY:gpt-6-luna}
    # max_tokens de cada paso, por la clave de su modelo (§9); siempre se envía al proveedor
    max-tokens:
      extraction: ${LMS_AI_MAX_TOKENS_EXTRACTION:8000}
      consistency: ${LMS_AI_MAX_TOKENS_CONSISTENCY:2000}
      design: ${LMS_AI_MAX_TOKENS_DESIGN:12000}
      script: ${LMS_AI_MAX_TOKENS_SCRIPT:16000}
      draft: ${LMS_AI_MAX_TOKENS_DRAFT:16000}
    # límites de los pasos de IA (ADR-0033 §9): pasos pendientes o en curso por organización y presupuesto por curso (la
    # suma del coste de sus ejecuciones en currency, con lms.ai.rates; vacío: sin tope). superarlos al encolar es 429 con
    # Retry-After; agotado el presupuesto, el paso que ya estaba en cola falla sin reintento
    limits:
      max-active-per-organization: ${LMS_AI_MAX_CONCURRENT_PER_ORGANIZATION:4}
      course-budget: ${LMS_AI_COURSE_BUDGET:}
      currency: ${LMS_AI_BUDGET_CURRENCY:USD}
      concurrency-retry-after: ${LMS_AI_CONCURRENCY_RETRY_AFTER:1m}
      budget-retry-after: ${LMS_AI_BUDGET_RETRY_AFTER:1h}
