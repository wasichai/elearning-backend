# pruebas: ninguna réplica de prueba ejecuta la cola por su cuenta. Los contextos de Spring que la caché de pruebas mantiene
# vivos comparten la base: con el @Scheduled encendido, uno de ellos podría reclamar el trabajo de otra clase y ejecutarlo
# con su propio generador. Cada prueba de la cola da las vueltas con JobRunner.runOnce
lms.jobs.scheduling=false
