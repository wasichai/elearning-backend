# pruebas: ninguna réplica de prueba ejecuta la cola por su cuenta. Los contextos de Spring que la caché de pruebas mantiene
# vivos comparten la base: con el @Scheduled encendido, uno de ellos podría reclamar el trabajo de otra clase y ejecutarlo
# con su propio generador. Cada prueba de la cola da las vueltas con JobRunner.runOnce
lms.jobs.scheduling=false

# pruebas: cada contexto de Spring que la caché de pruebas mantiene vivo abre su propio pool contra la misma base de
# Testcontainers. Con el pool por omisión (10 conexiones iniciales) y decenas de contextos en caché, PostgreSQL se queda sin
# conexiones (max_connections = 100) y los contextos nuevos no arrancan. Un pool pequeño por contexto basta para las pruebas
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5
